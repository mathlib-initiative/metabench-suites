# Runs every suite once against Mathlib master, to check that they all still pass. A suite marked
# `-- MetaBench CI exclude: #<PR>` benchmarks code from an open Mathlib PR and is skipped.
name: check

on:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: leanprover-community/mathlib4
          path: mathlib
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: mathlib-initiative/MetaBench
          path: metabench
          ssh-key: ${{ secrets.METABENCH_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Lean, and give MetaBench Mathlib's toolchain
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cp mathlib/lean-toolchain metabench/lean-toolchain

      - name: Choose the suites
        run: |
          suites=""
          for suite in suites/*.lean; do
            pr=$(sed -n 's/^-- MetaBench CI exclude: *//p' "$suite" | head -n 1)
            if [ -n "$pr" ]; then
              echo "::notice file=$suite::skipped, its code is in the open Mathlib PR $pr"
            else
              suites="$suites $suite"
            fi
          done
          echo "SUITES=$suites" >> "$GITHUB_ENV"

      - name: Build the suites' Mathlib imports
        if: env.SUITES != ''
        run: |
          files=$(METABENCH=metabench ./imports.sh --in mathlib mathlib shared $SUITES)
          cd mathlib
          lake exe cache get $files
          lake build $files

      - name: Run every suite once
        run: |
          failed=""
          for suite in $SUITES; do
            echo "::group::$suite"
            METABENCH=metabench ./bench-run.sh mathlib "$suite" -Dbench.iters=1 || failed="$failed $suite"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
